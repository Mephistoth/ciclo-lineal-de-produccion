{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<div>
<h2>Editar Usuario: {{ usuario.username }}</h2>
<hr>

<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" value="{{ usuario.first_name }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ usuario.email }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input type="number" name="telefono" class="form-control" value="{{ usuario.telefono }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Área</label>
        <select name="area" class="form-select">
            {% for area in areas %}
                <option value="{{ area.id_area }}"
                    {% if registro and area.id_area == registro.id_area.id_area %}selected{% endif %}>
                    {{ area.nombre }} ({{ area.id_empresa.nombre }})
                </option>
            {% endfor %}
        </select>
    </div>

    <button type="submit" class="btn btn-success">Guardar cambios</button>
    <a href="{% url 'admin_usuarios' %}" class="btn btn-secondary">Cancelar</a>
</form>

</div>

</body>
</html>
