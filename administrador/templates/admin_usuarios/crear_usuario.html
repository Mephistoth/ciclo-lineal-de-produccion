{% load static %}
<!DOCTYPE HTML>
<html lang="es">

<head>
    <title>Ciclo Circular</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tus estilos -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <noscript>
        <link rel="stylesheet" href="{% static 'css/noscript.css' %}" />
    </noscript>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="is-preload">

    <style>
        .formulario-usuario label,
        .formulario-usuario input,
        .formulario-usuario select,
        .formulario-usuario option,
        .formulario-usuario h2 {
            color: white !important;
        }

        .formulario-usuario input,
        .formulario-usuario select {
            background-color: rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            border: 1px solid #ddd !important;
        }

        .formulario-usuario input::placeholder {
            color: #e0e0e0 !important;
        }
    </style>

    <br>

    <div id="wrapper">
        <div class="container-sm formulario-usuario" style="margin-bottom:auto; max-width: 700px;">

            <h2 class="text-center">Crear Nuevo Usuario</h2>
            <hr>

            <form method="POST">
                {% csrf_token %}

                <!-- Username + Email -->
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="col">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                </div>

                <!-- Nombre + Apellido -->
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>
                    <div class="col">
                        <label class="form-label">Apellido</label>
                        <input type="text" name="apellido" class="form-control" required>
                    </div>
                </div>

                <!-- Teléfono -->
                <div class="mb-3">
                    <label class="form-label">Teléfono</label>
                    <input type="number" name="telefono" class="form-control" required>
                </div>

                <!-- Área -->
                <div class="mb-3">
                    <label class="form-label">Área</label>
                    <select class="form-select" name="area" required>
                        <option value="" disabled selected>Seleccione...</option>
                        {% for area in areas %}
                        <option value="{{ area.id_area }}">
                            {{ area.nombre }} ({{ area.id_empresa.nombre }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Botones -->
                <button class="btn btn-success">Crear Usuario</button>
                <a href="/administrador/usuarios?empresa={{ empresa_id }}" class="btn btn-secondary">Cancelar</a>

                <div class="mt-3">
                    {% if messages %}
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} mt-2">
                        {{ message }}
                    </div>
                    {% endfor %}
                    {% endif %}
                </div>

            </form>
        </div>
    </div>

    <div id="bg"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/browser.min.js' %}"></script>
    <script src="{% static 'js/breakpoints.min.js' %}"></script>
    <script src="{% static 'js/util.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>

</body>

</html>
