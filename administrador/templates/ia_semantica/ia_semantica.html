{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ciclo Circular</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>

<body class="is-preload">

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a id="home_admin" href="{% url 'home' %}">Volver al Inicio</a> <a href="{% url 'logout' %}"
                id="cerrarSesion">Cerrar sesión</a>
        </div>

        <h2 class="text-center mb-4">Procesamiento de Texto Libre (IA Semántica)</h2>

        <!-- Formulario de texto y archivo -->
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label for="archivo" class="form-label">Sube un archivo (.txt o .docx)</label>
                <input type="file" name="archivo" id="archivo" class="form-control">
            </div>

            <div class="mb-3">
                <label for="texto" class="form-label">Ingresa un texto libre</label>
                <textarea name="texto" id="texto" class="form-control" rows="6"
                    placeholder="Escribe tu texto aquí..."></textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">Generar Resumen</button>
            </div>
        </form>


        {% if resumen %}
        <hr>
        <h4>Resumen generado:</h4>
        <div class="alert alert-info mt-3">
            {{ resumen }}
        </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
