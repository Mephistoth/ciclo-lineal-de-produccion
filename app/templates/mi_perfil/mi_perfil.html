{% load static %} 
<!DOCTYPE HTML>
<html lang="es">

<head>
    <title>Ciclo Circular</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <noscript><link rel="stylesheet" href="{% static 'css/noscript.css' %}" /></noscript>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="is-preload">
    <div id="wrapper">
        <div class="container-sm" style="margin-bottom: auto;">

            {% if user.is_authenticated %}

            <!-- Barra superior -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <a id="home_admin" href="{% url 'home' %}">Volver al Inicio</a>
                <a href="{% url 'logout' %}" id="cerrarSesion">Cerrar sesión</a>
            </div>

            <!-- Empresa y Área -->
            {% if registros %}
                {% for i in registros %}
                    <div class="mb-2">
                        <h4>Empresa: {{ i.id_area.id_empresa.nombre }}</h4>
                        <h4>Área: {{ i.id_area.nombre }}</h4>
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Saludo -->
            <h3>Hola, bienvenido {{ user.first_name }}</h3>

            {% endif %}

            <hr>

            <!-- BOTÓN MI CV -->
            <div class="mt-3 text-start"></div>
                <a href="{% url 'subir_cv' %}" class="btn btn-outline-light no-hover-white">
                    MI CV
                </a>
            </div>

        </div>
    </div>

    <div id="bg"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/browser.min.js' %}"></script>
    <script src="{% static 'js/breakpoints.min.js' %}"></script>
    <script src="{% static 'js/util.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>

</body>
</html>
