<html>

<head>
    <title>Ciclo Circular</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">

    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <noscript>
        <link rel="stylesheet" href="{% static 'css/noscript.css' %}" />
    </noscript>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body class="is-preload">
    <div class="container-sm" style="margin-top: 50px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a id="home_admin" href="{% url 'home' %}">Volver al Inicio</a> <a href="{% url 'logout' %}"
                id="cerrarSesion">Cerrar sesión</a>
        </div>

        <h2 class="titulo-seccion text-center my-4" style="margin-top: 20px;">INGRESA TUS IDEAS</h2>

        <form method="POST" action="{% url 'ingresar_ideas' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label for="idea" class="form-label"><strong>Ingresa tu idea:</strong></label>
                <textarea id="idea" name="texto" class="form-control" rows="6"
                    placeholder="Escribe tu idea aquí..."></textarea>
            </div>

            <button type="submit" class="btn btn-success" style="margin-left: 480px;" >Guardar Idea</button>
        </form>
